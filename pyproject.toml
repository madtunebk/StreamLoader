[project]
name = "ruststream"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    # Pinned to git main, NOT a PyPI release: Qwen-Image-2.1 support
    # (QwenImage21Pipeline/QwenImage21Transformer2DModel/etc, needed by
    # inference/generate_qwen.py) isn't in 0.40.0, the latest PyPI
    # release as of 2026-09-23. A bare `uv run` from the repo root syncs
    # against THIS file -- if it ever reverts to a plain `>=0.40.0` pin,
    # `uv sync` will silently downgrade diffusers back to a PyPI release
    # and break Qwen-Image-2.1 imports (this happened once already).
    "diffusers @ git+https://github.com/huggingface/diffusers.git",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "maturin>=1.15.0",
]
